# sqlc yapılandırması — modül başına AYRI dosya.
#
# Ortak bir kök sqlc.yaml yerine modül başına config, modül izolasyonunun
# (plan Bölüm 2.1) araç düzeyindeki karşılığıdır: bir modülün şeması ya da
# sorguları değiştiğinde yalnızca kendi paketi yeniden üretilir ve iki modül
# aynı dosyayı düzenlemek zorunda kalmaz.
#
# Üretmek için: make gen
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: filedb
        out: repository/filedb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
