# gqlgen configuration — the product module's GraphQL storefront surface.
#
# The location has the same rationale as sqlc.yaml: code generation is
# configured PER MODULE, and the configuration stands next to the code it
# produces.
#
# CAUTION: the paths here are relative to the generator's WORKING DIRECTORY,
# not to this file. Running it from the repository root with
# `--config internal/modules/product/gqlgen.yml` DOES NOT FAIL; it silently
# reads an empty schema and produces a graph/ directory at the root. This is
# why `make gen` runs it after entering the module directory.
#
# The generator version is NOT PINNED HERE and that is deliberate: `make gen`
# runs the generator with `go tool gqlgen`, that is, with the version in
# go.mod. A second pin (a GQLGEN_VERSION in the Makefile) would mean writing
# the generator's version and the runtime library's version in TWO SEPARATE
# places; the day they drift, the generated code does not match the library
# running it, and the failure shows up not at compile time but in a helper
# function whose signature has changed.

schema:
  - graph/schema.graphqls

# The generated code sits in the SAME package as the HAND-WRITTEN resolver but
# in SEPARATE files.
#
# A separate package was not attempted because the model bindings (below) look
# at this package's types: were the generated code in a separate package, that
# package would look here for ProductList and this one would look there for the
# generated exec, and an import cycle would form.
exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/models_gen.go
  package: graph

# The "resolver:" block is DELIBERATELY ABSENT.
#
# Had the block been given, gqlgen would ALSO GENERATE the resolver files and
# rewrite them at every generation; those files are hybrids, both generated and
# hand-edited. In this repository generated code is not edited (see
# repository/productdb). This is why the resolvers are written entirely by hand
# (graph/resolver.go) and satisfy the generated ResolverRoot interface: a
# signature drift between the schema and the resolver is visible at COMPILE
# time.

# Slice elements CARRY NO POINTER.
#
# The service returns []service.StoreProduct, not []*service.StoreProduct;
# without this setting the generated code expects a pointer slice, the binding
# fails and every list field would needlessly fall through to a resolver.
omit_slice_element_pointers: true

# "go mod tidy" is NOT RUN after generation: this repository's tidy is a
# separate target (make tidy), and code generation silently changing go.mod
# would surprise whoever reads the `make gen` diff.
skip_mod_tidy: true

models:
  # Schema types are bound to the module's REAL types; a separate GraphQL model
  # layer is NOT GENERATED.
  #
  # Generated models plus a hand-written converter was also possible and was
  # REJECTED: the converter would be the SECOND definition of the question
  # "what is a storefront product", and nothing would break when a field added
  # to the service was silently forgotten there — every bug in this repository
  # was exactly of that class. With direct binding, the moment the service's
  # field name changes, the generation DOES NOT COMPILE.
  Product:
    model: github.com/bdrtr/gobit/internal/modules/product/service.StoreProduct
  Variant:
    model: github.com/bdrtr/gobit/internal/modules/product/service.StoreVariant
  ProductList:
    model: github.com/bdrtr/gobit/internal/modules/product/graph.ProductList
  Option:
    model: github.com/bdrtr/gobit/internal/modules/product/models.Option
  OptionValue:
    model: github.com/bdrtr/gobit/internal/modules/product/models.OptionValue
  Image:
    model: github.com/bdrtr/gobit/internal/modules/product/models.Image
  Tag:
    model: github.com/bdrtr/gobit/internal/modules/product/models.Tag
  Category:
    model: github.com/bdrtr/gobit/internal/modules/product/models.Category
  ProductOrder:
    model: github.com/bdrtr/gobit/internal/modules/product/models.ProductOrder

  # JSON is gqlgen's ready-made scalar carrying map[string]any; the name was
  # changed because in the schema it tells the client more ("Map" is the name of
  # a Go type, not of a contract).
  JSON:
    model: github.com/99designs/gqlgen/graphql.Map
