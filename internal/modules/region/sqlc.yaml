# sqlc yapılandırması — modül başına AYRI dosya (bkz. diğer modüller).
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: regiondb
        out: repository/regiondb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
