name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go.mod güncel mi
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # -coverpkg: onsuz yalnızca test edilen paketin KENDİ kodu sayılır ve bir
      # paketi başka paketin testi kapsadığında görünmez.
      - run: go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
      # BU SAYI YALNIZCA BİRİM TESTLERİNİNKİDİR (~%55) ve tek başına okunursa
      # yanıltır: depoda kapsamın büyük kısmı entegrasyon testlerinden gelir
      # (birim + entegrasyon, -coverpkg ile ~%76). Gerçek sayı Entegrasyon
      # işindedir; buradaki, birim testlerinin tek başına ne kadarını tuttuğudur.
      - name: Kapsam özeti (YALNIZCA birim testleri)
        run: go tool cover -func=coverage.out | tail -1

  integration:
    name: Entegrasyon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # testcontainers-go, runner'daki Docker daemon'ı kullanarak gerçek
      # Postgres ve Redis kaldırır; ayrıca servis tanımı gerekmez.
      - name: Entegrasyon testleri
        run: |
          go test -race -tags=integration -count=1 -timeout 15m \
            -coverpkg=./... -coverprofile=coverage-integration.out -covermode=atomic ./...
      # Deponun GERÇEK kapsamı budur: birim + entegrasyon, paketler arası
      # atıfla. Test işindeki sayı yalnızca birim testlerini kapsar.
      - name: Kapsam özeti (birim + entegrasyon)
        run: go tool cover -func=coverage-integration.out | tail -1

  # Smoke, Entegrasyon işine EKLENMEDİ ve bu bilinçlidir: bu testler ikiliyi
  # derleyip gerçek süreçler başlatır, yani hem daha yavaştırlar hem de bambaşka
  # bir arıza sınıfını kanıtlarlar — main.go'nun kablolaması, açılıştaki
  # migration'lar, config yüklemesi ve sinyal işleme. Ayrı iş olmalarının somut
  # karşılığı, PR sayfasında ayrı bir kırmızı: "entegrasyon düştü" ile "uygulama
  # AÇILMIYOR" aynı satırda görünmemeli.
  #
  # Kapsam ölçülmez: ölçülen şey kapsanan satır değil, sürecin davranışıdır ve
  # -coverpkg burada yalnızca gürültü üretirdi (sunucu ayrı bir süreçtir,
  # profili zaten toplanamaz).
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # testcontainers-go, runner'daki Docker daemon'ı kullanarak gerçek
      # Postgres ve Redis kaldırır; ayrıca servis tanımı gerekmez.
      - name: Smoke testleri
        run: go test -tags=smoke -count=1 -timeout 20m ./internal/smoke/
