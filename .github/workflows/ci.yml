name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Is go.mod up to date
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # The same question, asked of the generated tree (ADR 0122).
      #
      # The source .sql file is NOT the query the database runs — the string in
      # the generated .sql.go is — so an edit to the source alone is executed by
      # nothing, and build, vet, the unit lane and the integration lane against a
      # real PostgreSQL all stay clean while it is wrong. Measured, not assumed:
      # docs/measurements/0122.
      #
      # It runs here rather than in a job of its own for govulncheck's reason
      # below: it needs the module graph this job already has, and `make gen`
      # itself is two seconds. sqlc is built from the version the Makefile pins;
      # gqlgen needs no install, running through `go tool` from go.mod.
      #
      # /bin/ is gitignored, so the tool this installs cannot dirty the tree it
      # is about to judge.
      - name: Is the generated code up to date
        run: |
          make gen
          git diff --exit-code
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      # govulncheck runs in the LINT job rather than in one of its own.
      #
      # It needs no database and no Docker, it finishes in seconds, and a fifth
      # job would spend a runner's startup on a scan that is cheaper than the
      # checkout it would wait for. What it does need is the module graph, which
      # this job already has.
      #
      # It runs through `make vuln` and not through a bare command, so the
      # target a developer runs locally is the target CI runs — including the
      # two guards inside it, which no `run:` line here would carry.
      - name: Known vulnerabilities
        run: make vuln

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # -coverpkg: without it only the tested package's OWN code counts, and it
      # becomes invisible when one package is covered by another package's test.
      - run: go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
      # THIS NUMBER IS THE UNIT TESTS' ALONE (~55%) and misleads when read on its
      # own: in this repository most of the coverage comes from the integration
      # tests (unit + integration, ~76% with -coverpkg). The real number is in
      # the Integration job; this one is how much the unit tests hold by
      # themselves.
      - name: Coverage summary (unit tests ONLY)
        run: go tool cover -func=coverage.out | tail -1
      # The benchmarks run ONCE each, which measures nothing and is not meant
      # to: timings from a shared runner are noise. What this catches is a
      # benchmark that stopped compiling, or whose fixture drifted until it
      # measures the error path — the guard clause inside each one fails here
      # rather than months later when somebody finally reads the numbers.
      # A benchmark nobody ever runs is the capability-without-a-consumer
      # class this repository already has a name for (ADR 0009).
      - name: Benchmarks still build and measure the real path
        run: go test -run '^$' -bench . -benchtime=1x ./...

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # testcontainers-go brings up a real Postgres and Redis using the runner's
      # Docker daemon; no separate service definition is needed.
      - name: Integration tests
        run: |
          go test -race -tags=integration -count=1 -timeout 15m \
            -coverpkg=./... -coverprofile=coverage-integration.out -covermode=atomic ./...
      # This is the repository's REAL coverage: unit + integration, with
      # cross-package attribution. The number in the Test job covers the unit
      # tests only.
      - name: Coverage summary (unit + integration)
        run: go tool cover -func=coverage-integration.out | tail -1

  # Smoke was NOT ADDED to the Integration job and that is deliberate: these
  # tests build the binary and start real processes, so they are both slower and
  # they prove a completely different class of failure — main.go's wiring, the
  # migrations at startup, config loading and signal handling. The concrete
  # counterpart of their being a separate job is a separate red on the PR page:
  # "integration fell" and "the application DOES NOT START" must not appear on
  # the same line.
  #
  # Coverage is not measured: what is measured is not the covered line but the
  # process's behavior, and -coverpkg would produce nothing but noise here (the
  # server is a separate process, its profile cannot be collected anyway).
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # testcontainers-go brings up a real Postgres and Redis using the runner's
      # Docker daemon; no separate service definition is needed.
      - name: Smoke tests
        run: go test -tags=smoke -count=1 -timeout 20m ./internal/smoke/
