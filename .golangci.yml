# golangci-lint v2 configuration
version: "2"

run:
  timeout: 5m
  tests: true
  # The `integration` tagged files are analyzed too.
  #
  # Without this they are invisible to every cheap lane: `go build ./...`,
  # `go test ./...` and `golangci-lint run ./...` all skip a file whose build
  # constraint is not satisfied, so the only thing that compiles them is
  # `make test-integration`, which needs Docker and takes minutes. A hundred and
  # thirty-five files sat outside every fast check, and a signature change that
  # broke three of them was green in every lane that runs without a container
  # (gap D88).
  #
  # Only ONE tag is named, deliberately. `smoke` files start real processes and
  # `load` files are benchmarks; both are their own lanes and neither has ever
  # been the thing a refactor silently broke.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - gocritic
    - goconst
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert

  settings:
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
          severity: warning
        - name: package-comments
    misspell:
      locale: US
      # Turkish words are mistaken for English misspellings. While a file is
      # still Turkish this is unavoidable, so the exception is kept word by
      # word.
      #
      # THE TRADE-OFF IS ACCEPTED OPENLY: the exception holds REPOSITORY-WIDE,
      # which means a real typo in an English text passes silently too. The
      # alternative was to change the word at every Turkish occurrence or to
      # sprinkle nolint around; both wreck the comments.
      #
      # The list is DATA, not prose: dropping an entry is not a translation but
      # a behavior change, and it belongs to the day the language ratchet
      # (ADR 0012) reaches zero — not to the translation of the file that
      # happens to contain the word. Each entry documents what it stands in for:
      #   paralel  -> mistaken for "parallel"
      #   mamal    -> inside "acmamalidir", mistaken for "mammal"
      #   adres    -> mistaken for "address"
      ignore-rules:
        - paralel
        - mamal
        - adres
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks: [whyNoLint, hugeParam]

    # The Architectural Principles (plan Section 2) are enforced here, before compilation.
    depguard:
      rules:
        # Principle 2.4: core does not know the modules.
        core-does-not-know-modules:
          # BOTH core trees, and the second glob was missing until 2026-09-07.
          # ADR 0026 moved the published half of the core out to top-level
          # `core/` and this rule kept pointing only at what stayed behind, so
          # for thirteen packages it matched nothing and enforced nothing.
          #
          # It was not a live hazard, and that is worth writing down rather than
          # implying: the published tree is held to a STRICTER rule on the arch
          # side — TestNoPublishedPackageImportsAnInternalOne forbids importing
          # internal/ at all, which includes internal/modules. So the lint rule
          # was silently redundant rather than silently absent. It is corrected
          # because a rule that matches nothing reads as a rule that passes.
          files:
            - "**/internal/core/**"
            - "core/**"
          deny:
            - pkg: "github.com/bdrtr/gobit/internal/modules"
              desc: "Principle 2.4 - core does not know the modules; the dependency direction is module -> core."
        module-isolation-product:
          files:
            - "**/internal/modules/product/**"
          deny:
            - pkg: "github.com/bdrtr/gobit/internal/modules/pricing"
              desc: "Principle 2.1/2.4 - the product module cannot depend directly on the pricing module; access goes through the container with a service interface."
            - pkg: "github.com/bdrtr/gobit/internal/modules/inventory"
              desc: "Principle 2.1/2.4 - the product module cannot depend directly on the inventory module; access goes through the container with a service interface."
