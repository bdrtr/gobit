# golangci-lint v2 yapılandırması
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - gocritic
    - goconst
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert

  settings:
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
          severity: warning
        - name: package-comments
    misspell:
      locale: US
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks: [whyNoLint, hugeParam]

    # Mimari Prensipler (plan Bölüm 2) derleme öncesi burada zorlanır.
    depguard:
      rules:
        # Prensip 2.4: Core, modülleri tanımaz.
        core-modulleri-tanimaz:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: "github.com/bdrtr/gobit/internal/modules"
              desc: "Prensip 2.4 - core modulleri tanimaz; bagimlilik yonu modul -> core'dur."
        modul-izolasyonu-product:
          files:
            - "**/internal/modules/product/**"
          deny:
            - pkg: "github.com/bdrtr/gobit/internal/modules/pricing"
              desc: "Prensip 2.1/2.4 - product modulu pricing moduluna dogrudan bagimli olamaz; erisim container uzerinden servis interface ile yapilir."
            - pkg: "github.com/bdrtr/gobit/internal/modules/inventory"
              desc: "Prensip 2.1/2.4 - product modulu inventory moduluna dogrudan bagimli olamaz; erisim container uzerinden servis interface ile yapilir."
            - pkg: "github.com/bdrtr/gobit/internal/modules/cart"
              desc: "Prensip 2.1/2.4 - product modulu cart moduluna dogrudan bagimli olamaz; erisim container uzerinden servis interface ile yapilir."
            - pkg: "github.com/bdrtr/gobit/internal/modules/order"
              desc: "Prensip 2.1/2.4 - product modulu order moduluna dogrudan bagimli olamaz; erisim container uzerinden servis interface ile yapilir."
            - pkg: "github.com/bdrtr/gobit/internal/modules/payment"
              desc: "Prensip 2.1/2.4 - product modulu payment moduluna dogrudan bagimli olamaz; erisim container uzerinden servis interface ile yapilir."
            - pkg: "github.com/bdrtr/gobit/internal/modules/fulfillment"
              desc: "Prensip 2.1/2.4 - product modulu fulfillment moduluna dogrudan bagimli olamaz; erisim container uzerinden servis interface ile yapilir."
            - pkg: "github.com/bdrtr/gobit/internal/modules/customer"
              desc: "Prensip 2.1/2.4 - product modulu customer moduluna dogrudan bagimli olamaz; erisim container uzerinden servis interface ile yapilir."
            - pkg: "github.com/bdrtr/gobit/internal/modules/promotion"
              desc: "Prensip 2.1/2.4 - product modulu promotion moduluna dogrudan bagimli olamaz; erisim container uzerinden servis interface ile yapilir."
            - pkg: "github.com/bdrtr/gobit/internal/modules/tax"
              desc: "Prensip 2.1/2.4 - product modulu tax moduluna dogrudan bagimli olamaz; erisim container uzerinden servis interface ile yapilir."
            - pkg: "github.com/bdrtr/gobit/internal/modules/region"
