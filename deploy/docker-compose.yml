name: gobit

# GÜVENLİK: Yayınlanan portlar bilinçli olarak 127.0.0.1'e bağlanmıştır.
# 0.0.0.0'a açılsalardı, paylaşılan bir ağda (ofis/kafe WiFi) aynı alt ağdaki
# herhangi bir cihaz Postgres'e superuser olarak bağlanabilir, Redis'e ise
# kimlik doğrulama olmadan erişebilirdi.
services:
  postgres:
    image: postgres:16-alpine
    container_name: gobit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gobit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gobit}
      POSTGRES_DB: ${POSTGRES_DB:-gobit}
      # Deterministik sıralama ve karşılaştırma için.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: gobit-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gobit}
    # Event bus (Redis Streams) için AOF kalıcılığı açık; parola zorunlu.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
