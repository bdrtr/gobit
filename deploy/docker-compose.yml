name: gobit

services:
  postgres:
    image: postgres:16-alpine
    container_name: gobit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gobit
      POSTGRES_PASSWORD: gobit
      POSTGRES_DB: gobit
      # Deterministik sıralama ve karşılaştırma için.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gobit -d gobit"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: gobit-redis
    restart: unless-stopped
    # Event bus (Redis Streams) için AOF kalıcılığı açık.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
