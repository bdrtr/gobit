name: gobit

# GÜVENLİK: Yayınlanan portlar bilinçli olarak 127.0.0.1'e bağlanmıştır.
# 0.0.0.0'a açılsalardı, paylaşılan bir ağda (ofis/kafe WiFi) aynı alt ağdaki
# herhangi bir cihaz Postgres'e superuser olarak bağlanabilir, Redis'e ise
# kimlik doğrulama olmadan erişebilirdi.
services:
  postgres:
    image: postgres:16-alpine
    container_name: gobit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gobit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gobit}
      POSTGRES_DB: ${POSTGRES_DB:-gobit}
      # Deterministik sıralama ve karşılaştırma için.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: gobit-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gobit}
    # Event bus (Redis Streams) için AOF kalıcılığı açık; parola zorunlu.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # İZLEME TOPLAYICISI — bilinçli olarak PROFİL ARKASINDA.
  #
  # `make up` bunu BAŞLATMAZ: izleme kapalıyken uygulama hiçbir dış bağlantı
  # denemez ve geliştirme kurulumu bir toplayıcı çalıştırmak zorunda değildir.
  # Toplayıcıyı istemek AÇIK bir karardır (bkz. `make up-tracing`).
  #
  # all-in-one imajı bellek içi depo kullanır: yeniden başlatmada trace'ler
  # kaybolur. Geliştirme ve doğrulama içindir, üretim için değildir.
  #
  # YALNIZCA TRACE KABUL EDER. Uygulama aynı uca metrik de göndermeye çalışır
  # ve Jaeger bunu reddeder; her dışa aktarma aralığında şu satır düşer:
  #
  #   failed to upload metrics: ... unknown service ...MetricsService
  #
  # Zararsızdır (izleme arızası uygulamayı düşürmez, bkz. ADR 0007) ama
  # gürültülüdür. Metrik de toplamak isteyen bir kurulum, uygulamayı bir
  # OpenTelemetry Collector'a yöneltmeli ve trace'leri oradan Jaeger'a
  # iletmelidir. Buraya Collector koymamak bilinçlidir: bir yapılandırma
  # dosyası daha getirir ve bu profilin tek işi "trace'ler gerçekten dışa
  # aktarılıyor mu" sorusunu cevaplamaktır.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: gobit-jaeger
    profiles: ["tracing"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # 16686: web arayüzü. 4317: OTLP/gRPC — uygulamanın bağlandığı port.
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"

volumes:
  postgres-data:
  redis-data:
