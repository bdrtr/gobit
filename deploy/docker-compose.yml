name: gobit

# SECURITY: the published ports are deliberately bound to 127.0.0.1. Were they
# opened on 0.0.0.0, on a shared network (office/cafe WiFi) any device on the
# same subnet could connect to Postgres as superuser and reach Redis with no
# authentication at all.
services:
  postgres:
    image: postgres:16-alpine
    container_name: gobit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gobit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gobit}
      POSTGRES_DB: ${POSTGRES_DB:-gobit}
      # CTYPE is C.UTF-8, while COLLATE stays byte order.
      #
      # This once read "--locale=C" so that ordering would be deterministic, and
      # that setting SILENTLY BROKE SEARCH: the C locale folds ASCII letters
      # only, so a customer searching for the Turkish word "çanta" (bag) COULD
      # NOT FIND a product titled "Çanta" — no error, no log, just an empty
      # list. Both the storefront's own `title ILIKE '%q%'` filter and the
      # search-pg plugin's to_tsvector depend on the cluster's CTYPE.
      #
      # Measured (same image, three setups):
      #   --locale=C                       ILIKE ✗   to_tsvector ✗
      #   --locale=C.UTF-8                 ILIKE ✓   to_tsvector ✓
      #   --locale=C --locale-provider=icu ILIKE ✓   to_tsvector ✗   (half a fix)
      #
      # C.UTF-8 does not lose the ordering: the comparison is still byte order,
      # the only thing that changes is letter folding.
      #
      # CAUTION: the locale is fixed AT initdb TIME. An existing data directory
      # keeps its old setting; fixing it requires a dump/restore. The
      # application tests this at startup and warns when it is broken
      # (internal/core/db/casefold.go).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: gobit-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gobit}
    # AOF persistence is on for the event bus (Redis Streams); a password is mandatory.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # TRACE COLLECTOR — deliberately BEHIND A PROFILE.
  #
  # `make up` DOES NOT START it: while tracing is off the application attempts
  # no outbound connection at all, and a development setup is not obliged to run
  # a collector. Asking for the collector is an EXPLICIT decision (see
  # `make up-tracing`).
  #
  # The all-in-one image uses an in-memory store: traces are lost on restart. It
  # is meant for development and verification, not for production.
  #
  # IT ACCEPTS TRACES ONLY. The application tries to send metrics to the same
  # endpoint too and Jaeger rejects them; at every export interval this line
  # drops:
  #
  #   failed to upload metrics: ... unknown service ...MetricsService
  #
  # It is harmless (a tracing failure does not bring the application down, see
  # ADR 0007) but noisy. A setup that also wants to collect metrics should point
  # the application at an OpenTelemetry Collector and forward the traces from
  # there to Jaeger. Not putting a Collector here is deliberate: it would bring
  # one more configuration file, and this profile's single job is to answer the
  # question "are traces really being exported".
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: gobit-jaeger
    profiles: ["tracing"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # 16686: the web interface. 4317: OTLP/gRPC — the port the application connects to.
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"

volumes:
  postgres-data:
  redis-data:
